framework:
  name: AssiStuff
  version: 1.0.1-beta
  mode: local-first
runtime:
  ollama:
    host: http://localhost:11434
    keep_alive: 5m
    read_timeout_seconds: 180
    flash_attention: true
    kv_cache_type: q8_0
  utility_models:
    router: qwen2.5:3b
    planner: qwen2.5:7b
    mpa: aya-expanse:8b
    compiler: qwen2-math:7b
  registry: ~/.assistuff/models
  max_hops: 5
  residency:
    mode: hot_plug
    pinned: []
    background_models: []
    keep_alive: 5m
    max_loaded: 2
voice:
  enabled: false
  stt:
    engine: whisper_cpp
    binary_path: whisper-cli
    model_path: models/ggml-small.bin
    language: ru
    sample_rate: 16000
    max_record_seconds: 60.0
    silence_timeout_seconds: 1.2
    speech_threshold: 300.0
  auth:
    enabled: true
    model_path: models/vosk-model-small-ru-0.22
    speaker_model_path: models/vosk-model-spk-0.4
    voiceprints_dir: ~/.assistuff/profiles
    similarity_threshold: 0.35
    minimum_margin: 0.06
    enrollment_samples: 5
    enrollment_max_seconds: 45.0
  wake:
    enabled: false
    phrases:
    - north
    - hey north
    - норт
    - эй норт
    sample_rate: 16000
    frame_samples: 4000
    detection_timeout_seconds: 0.4
  tts:
    engine: piper
    voice: ru_RU-irina-medium
    rate: 180
    binary_path: models/piper/piper/piper
    library_path: models/piper/piper-phonemize/lib
    espeak_data_path: models/piper/piper-phonemize/share/espeak-ng-data
    model_path: models/piper/ru_RU-irina-medium.onnx
    config_path: models/piper/ru_RU-irina-medium.onnx.json
    player: /usr/bin/afplay
    enabled: true
memory:
  short_term:
    backend: sqlite
    max_messages: 20
  long_term:
    backend: markdown
    index:
      time: true
      keyword: true
      vector: false
      vector_model: paraphrase-multilingual-MiniLM-L12-v2
      reindex_on_start: true
      reindex_batch_size: 100
    tags:
      source: header
      bilingual: true
      dynamic: true
      new_tag_position: top
      max_per_note: 3
      min_per_note: 1
      fallback: '#misc'
      search_on_unknown_tag: retry
      max_retries: 1
  dossier:
    enabled: true
    compile_every: 20
    compile_model: planner
    max_slice_tokens: 800
    sections:
      identity: always
      preferences: always
      projects: on_keyword
      recent_topics: on_time_query
      patterns: on_habit_query
      relationships: on_person_query
profiles:
  storage_dir: ~/.assistuff/profiles
  default: default
tasks:
  max_steps: 12
  plugin_dir: plugins
  enabled_plugins: []
access:
  default_level: 0
  profile_levels: {}
  require_confirmation_level: 5
  deny_is_final: true
  no_confirmation_dialogs: true
  log_all_denials: true
ui:
  theme: dark
  start_minimized: false
  show_telemetry_in_main: false
  telemetry_interval_ms: 1000
  tray_icon_size: 22
  tabs:
  - chat
  - models
  - tasks
  - memory
  - visual
  - vtt
  - graph
  - skills
  - trace
  - settings
  - plugins
vtt:
  ruleset: gurps_3d6
  map_width: 16
  map_height: 10
telemetry:
  cpu: true
  ram: true
  gpu: false
  temperature: false
hardware:
  profile: generic
  ram_gb: 16
  cpu_cores: 8
  gpu_usable: false
output_chain:
  emitters:
  - gui
  - tts
  - log
  filters_min_kind: result
  stream_to_gui: false
