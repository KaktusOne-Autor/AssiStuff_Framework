[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assistuff"
version = "1.0"
description = "AssiStuff Framework — local-first voice assistant with peer-to-peer models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CyberRabotnik" }]
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "requests>=2.31",
    "psutil>=5.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
gui = [
    "PyQt6>=6.6",
    "pyqtgraph>=0.13",
    "qt-material>=2.14",
]
voice = [
    "sounddevice>=0.4.7",
    "vosk>=0.3.44",
]
pack = [
    "zstandard>=0.22",
    "cryptography>=42.0",
    "huggingface-hub>=0.23",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
assistuff = "assistuff.__main__:main"
assistuff-pack = "assistuff.pack.cli:main"

[tool.setuptools.packages.find]
include = ["assistuff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true